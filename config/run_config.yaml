# config/run_config.test.yaml
# === Run identity ===
run_id: "test_rbfox2_iter_00"
target_protein: "RBFOX2"
clip_protocol: "eCLIP"

samples:
  ip:
    rep1:
      bam: results/ip_rep1/dedup.bam
    rep2:
      bam: results/ip_rep2/dedup.bam
  input_control:
    rep1:
      bam: results/input_control_rep1/dedup.bam

reference:
  genome_fasta: "ref/test_chr21.fa"
  annotation_gtf: "ref/test_chr21.gtf"

pureclip:
  bandwidth_nt: 50
  merge_distance_nt: 8
  high_precision_mode: false
  use_input_covariate: false
  use_cl_motif_covariate: false
  cl_motif_file: null

postprocessing:
  force_width: 9
  cluster_gap_width: 8
  min_region_length_nt: 3
  min_crosslink_events: 3

reproducibility:
  percentile_threshold: 10
  min_crosslink_events_floor: 2
  min_replicates_passing: 2

resources:
  max_memory_gb: 16
  threads: 8
