# LLM-vs-Optuna comparison manifest for scripts/run/overnight_batch.py.
# Same dataset, same evaluation, same objective and bounds, matched trial budget
# — only the search strategy differs (optimizer: llm | optuna).
#
#   PYTHONPATH=. uv run python scripts/run/overnight_batch.py \
#       --manifest config/compare_jobs.yaml --hours 8 \
#       --pureclip-dir /vol/storage1/johannes/projects

defaults:
  max_iter: 12                    # matched budget of expensive evaluations
  threads: 32
  learn_on_chr21: true
  per_job_timeout_min: 240
  optimizer: llm
  objective_weights:
    reproducibility: 0.5
    motif: 0.25
    recall: 0.25

jobs:
  - {id: rbfox2_k562_llm,    dataset: RBFOX2_K562, optimizer: llm}
  - {id: rbfox2_k562_optuna, dataset: RBFOX2_K562, optimizer: optuna}
  - {id: pum1_k562_llm,      dataset: PUM1_K562,   optimizer: llm}
  - {id: pum1_k562_optuna,   dataset: PUM1_K562,   optimizer: optuna}
