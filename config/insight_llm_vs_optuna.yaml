# Insight experiment — does the LLM's biological prior help MORE as the motif
# gets harder? The preliminary LLM-vs-Optuna comparison (bigrun2) used only the
# crisp-motif set (PUM1/QKI/RBFOX2). The 2026-07 batch added splicing factors
# whose motifs are degenerate or positional — exactly where Optuna searches
# blind but the LLM has a prior. We run BOTH optimizers on five new datasets
# spanning the difficulty axis (all K562, so cell line is held fixed):
#
#   crisp        PUM2_K562    UGUANAUA (Pumilio) — positive control; expect LLM ≈ Optuna
#   degenerate   SRSF1_K562   GA-rich ESE (SR protein)
#   degenerate   HNRNPK_K562  C-rich (also re-confirms the PSSM log-odds fix)
#   positional   U2AF2_K562   polypyrimidine tract (poly-Y, splice site)
#   positional   SF3B4_K562   U2 snRNP / branch point
#
# Hypothesis: LLM's margin over Optuna widens from crisp → degenerate → positional.
# Optuna gets the larger trial budget (12 vs 8) so any LLM win isn't just "more search".
#
# Launch (on the runner):
#   export PATH=/vol/storage1/johannes/projects:$HOME/.local/bin:$PATH
#   PYTHONPATH=. uv run python scripts/overnight_batch.py \
#       --manifest config/insight_llm_vs_optuna.yaml --hours 16 --no-repeat \
#       --pureclip-dir /vol/storage1/johannes/projects

defaults:
  threads: 32
  learn_on_chr21: true
  per_job_timeout_min: 150
  objective_weights:
    reproducibility: 0.5
    motif: 0.25
    recall: 0.25

jobs:
  - {id: ins_pum2_k562_llm,     dataset: PUM2_K562,   optimizer: llm,    max_iter: 8}
  - {id: ins_pum2_k562_optuna,  dataset: PUM2_K562,   optimizer: optuna, max_iter: 12}
  - {id: ins_srsf1_k562_llm,    dataset: SRSF1_K562,  optimizer: llm,    max_iter: 8}
  - {id: ins_srsf1_k562_optuna, dataset: SRSF1_K562,  optimizer: optuna, max_iter: 12}
  - {id: ins_hnrnpk_k562_llm,   dataset: HNRNPK_K562, optimizer: llm,    max_iter: 8}
  - {id: ins_hnrnpk_k562_optuna,dataset: HNRNPK_K562, optimizer: optuna, max_iter: 12}
  - {id: ins_u2af2_k562_llm,    dataset: U2AF2_K562,  optimizer: llm,    max_iter: 8}
  - {id: ins_u2af2_k562_optuna, dataset: U2AF2_K562,  optimizer: optuna, max_iter: 12}
  - {id: ins_sf3b4_k562_llm,    dataset: SF3B4_K562,  optimizer: llm,    max_iter: 8}
  - {id: ins_sf3b4_k562_optuna, dataset: SF3B4_K562,  optimizer: optuna, max_iter: 12}
