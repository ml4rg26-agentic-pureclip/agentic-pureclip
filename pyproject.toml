[project]
name = "agentic-pureclip"
version = "0.1.0"
description = "LLM-driven PureCLIP parameter optimization for eCLIP data"
requires-python = ">=3.10"
dependencies = [
    "gdown>=5.0",
    "snakemake>=7.32",
    "tomli>=2.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.3.0",
    "langsmith",
    "optuna>=3.6",
    "python-dotenv",
    "pytest",
    "pydantic>=2.0",
    "pyyaml",
    "pandas",
    "matplotlib>=3.8.0",
    "langchain-google-genai>=2.0.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The core lives under src/agentic_pureclip (loop / scoring / postprocess / pipeline).
packages = ["src/agentic_pureclip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
